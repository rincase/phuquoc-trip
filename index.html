<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173a59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="富國島旅遊">
  <title>富國島家庭旅遊</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="trip-header card">
      <img src="./assets/hero.svg" class="trip-thumb" alt="富國島熱帶海灘插畫">
      <div class="trip-copy">
        <div class="eyebrow">PHU QUOC · 2026</div>
        <h1>富國島家庭旅遊</h1>
      </div>
      <div class="trip-dates">
        <strong>10.18—10.23</strong>
        <span>六天五夜</span>
      </div>
    </header>

    <main id="app" class="main-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="nav-item is-active" data-view="today" aria-label="今日"><span class="nav-icon">▣</span><span>今日</span></button>
      <button class="nav-item" data-view="map" aria-label="地圖"><span class="nav-icon">⌖</span><span>地圖</span></button>
      <button class="nav-item" data-view="itinerary" aria-label="行程"><span class="nav-icon">☷</span><span>行程</span></button>
      <button class="nav-item" data-view="tools" aria-label="工具"><span class="nav-icon">▤</span><span>工具</span></button>
      <button class="nav-item" data-view="checklist" aria-label="清單"><span class="nav-icon">☆</span><span>清單</span></button>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
